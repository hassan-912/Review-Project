[theme]
base = "light"
primaryColor = "#0067DA"
backgroundColor = "#F3F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1F3A"
borderColor = "#D9E2EF"
font = "sans-serif"
baseRadius = "12px"

[server]
headless = true
maxUploadSize = 20
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = "none"

[browser]
gatherUsageStats = false
